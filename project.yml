name: SARI

options:
  bundleIdPrefix: sa.sari
  minimumXcodeGenVersion: 2.45.4

packages:
  SwiftLlama:
    url: https://github.com/profclaw/swift-llama
    exactVersion: 0.1.0

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  SARI:
    type: application
    platform: iOS
    info:
      path: SARI/Info.plist
      properties:
        CFBundleDisplayName: ساري
        NSLocationWhenInUseUsageDescription: SARI uses your location to calculate prayer times, Qibla, and nearby travel services.
        SARI_API_BASE_URL: https://YOUR-SARI-BACKEND.example
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - KFGQPCAnRegular.ttf
          - KFGQPCHafsUthmanic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: SARI/Sources
      - path: SARI/Resources
        buildPhase: resources
      - path: SharedResources/data
        buildPhase: resources
      - path: SARI/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.sari.app
        PRODUCT_NAME: SARI
        MARKETING_VERSION: 0.9.6
        CURRENT_PROJECT_VERSION: 15
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SARI/Info.plist
        CODE_SIGN_ENTITLEMENTS: SARI/SARI.entitlements
    dependencies:
      - package: SwiftLlama
      - sdk: libsqlite3.tbd
      - target: SARIWidgetExtension

  SARIWidgetExtension:
    type: app-extension
    platform: iOS
    info:
      path: SARIWidget/Info.plist
      properties:
        CFBundleDisplayName: ساري
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: SARIWidget
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - SARIWidget.entitlements
      - path: SARIWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.sari.app.widget
        PRODUCT_NAME: SARIWidgetExtension
        MARKETING_VERSION: 0.9.6
        CURRENT_PROJECT_VERSION: 15
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SARIWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: SARIWidget/SARIWidget.entitlements
