name: SARI
options:
  bundleIdPrefix: sa.sari
packages:
  SwiftLlama:
    url: https://github.com/profclaw/swift-llama
    from: 0.1.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  SARI:
    type: application
    platform: iOS
    sources:
      - SARI/Sources
    resources:
      - SARI/Resources
      - SARI/PrivacyInfo.xcprivacy
      - SharedResources/data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.sari.app
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 6
        INFOPLIST_KEY_CFBundleDisplayName: ساري
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: SARI uses your location to calculate prayer times, Qibla, and nearby travel services.
        INFOPLIST_KEY_SARI_API_BASE_URL: https://YOUR-SARI-BACKEND.example
        CODE_SIGN_ENTITLEMENTS: SARI/SARI.entitlements
    dependencies:
      - package: SwiftLlama
      - sdk: libsqlite3.tbd
      - target: SARIWidgetExtension
  SARIWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SARIWidget
    resources:
      - SARIWidget/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.sari.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: ساري
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: SARI uses your location to calculate prayer times, Qibla, and nearby travel services.
        CODE_SIGN_ENTITLEMENTS: SARIWidget/SARIWidget.entitlements
    entitlements:
      path: SARIWidget/SARIWidget.entitlements
