name: SARI iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          PINNED="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ -d "$PINNED" ]]; then
            export DEVELOPER_DIR="$PINNED"
          else
            export DEVELOPER_DIR="$(xcode-select -p)"
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          swiftc --version

      - name: Static project preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preflight_ios.py
          find SARI/Sources SARIWidget -type f -name '*.swift' -print0 \
            | xargs -0 swiftc -parse

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew untap aws/tap >/dev/null 2>&1 || true
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf SARI.xcodeproj
          xcodegen generate
          test -f SARI.xcodeproj/project.pbxproj
          xcodebuild -project SARI.xcodeproj -list

      - name: Validate generated project inputs
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint SARI/Info.plist
          plutil -lint SARIWidget/Info.plist
          plutil -lint SARI/PrivacyInfo.xcprivacy
          plutil -lint SARIWidget/PrivacyInfo.xcprivacy
          plutil -lint SARI/SARI.entitlements
          plutil -lint SARIWidget/SARIWidget.entitlements

          xcodebuild \
            -project SARI.xcodeproj \
            -target SARI \
            -configuration Debug \
            -showBuildSettings > "$RUNNER_TEMP/sari-app-build-settings.txt"

          xcodebuild \
            -project SARI.xcodeproj \
            -target SARIWidgetExtension \
            -configuration Debug \
            -showBuildSettings > "$RUNNER_TEMP/sari-widget-build-settings.txt"

          grep -Fq "INFOPLIST_FILE = SARI/Info.plist" "$RUNNER_TEMP/sari-app-build-settings.txt"
          grep -Fq "GENERATE_INFOPLIST_FILE = NO" "$RUNNER_TEMP/sari-app-build-settings.txt"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = sa.sari.app" "$RUNNER_TEMP/sari-app-build-settings.txt"
          grep -Fq "INFOPLIST_FILE = SARIWidget/Info.plist" "$RUNNER_TEMP/sari-widget-build-settings.txt"
          grep -Fq "GENERATE_INFOPLIST_FILE = NO" "$RUNNER_TEMP/sari-widget-build-settings.txt"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = sa.sari.app.widget" "$RUNNER_TEMP/sari-widget-build-settings.txt"

          for resource in \
            quran_tafseer.json ui_strings.json adhkar.json scholars.json countries.json \
            fiqh_pages.sqlite3 KFGQPCAnRegular.ttf KFGQPCHafsUthmanic.ttf \
            AdhanAliMulla.caf AdhanQatami.caf AdhanBaafif.caf AdhanDughariri.caf \
            PrivacyInfo.xcprivacy; do
            grep -Fq "$resource" SARI.xcodeproj/project.pbxproj
          done

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project SARI.xcodeproj \
            -scheme SARI \
            -resolvePackageDependencies

      - name: Build SARI for iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/SARIDerivedData"
          set -o pipefail
          xcodebuild \
            -project SARI.xcodeproj \
            -scheme SARI \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SARIDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/sari-build.log"

      - name: Verify built bundles
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SARIDerivedData/Build/Products/Debug-iphoneos/SARI.app"
          WIDGET_PATH="$APP_PATH/PlugIns/SARIWidgetExtension.appex"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -d "$WIDGET_PATH"
          test -f "$WIDGET_PATH/Info.plist"

          plutil -lint "$APP_PATH/Info.plist"
          plutil -lint "$WIDGET_PATH/Info.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "sa.sari.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")" = "sa.sari.app.widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_PATH/Info.plist")" = "com.apple.widgetkit-extension"

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          WIDGET_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET_PATH/Info.plist")"
          test "$APP_VERSION" = "$WIDGET_VERSION"

          for resource in \
            ui_strings.json adhkar.json quran_tafseer.json scholars.json countries.json \
            fiqh_pages.sqlite3 KFGQPCAnRegular.ttf KFGQPCHafsUthmanic.ttf \
            AdhanAliMulla.caf AdhanQatami.caf AdhanBaafif.caf AdhanDughariri.caf; do
            test -n "$(find "$APP_PATH" -name "$resource" -print -quit)"
          done

          test -n "$(find "$APP_PATH" -name PrivacyInfo.xcprivacy -print -quit)"
          test -f "$WIDGET_PATH/PrivacyInfo.xcprivacy"

      - name: Package unsigned app payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SARIDerivedData/Build/Products/Debug-iphoneos/SARI.app"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f SARI-unsigned.ipa
          zip -qry SARI-unsigned.ipa Payload
          test -s SARI-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: SARI-iPhone-unsigned
          path: |
            ${{ runner.temp }}/SARI-unsigned.ipa
            ${{ runner.temp }}/sari-build.log
            ${{ runner.temp }}/sari-app-build-settings.txt
            ${{ runner.temp }}/sari-widget-build-settings.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: SARI-iOS-build-failure-diagnostics
          path: |
            ${{ runner.temp }}/sari-build.log
            ${{ runner.temp }}/sari-app-build-settings.txt
            ${{ runner.temp }}/sari-widget-build-settings.txt
          if-no-files-found: ignore
          retention-days: 7
