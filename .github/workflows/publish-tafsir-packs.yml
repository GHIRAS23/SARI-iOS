name: Publish tafsir packs

# Run once after the first push, and again whenever QuranEnc content should be refreshed.
# Builds the offline verse-meaning packs and commits them to tafsir-packs/ on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build packs from QuranEnc
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_tafsir_packs.py --out tafsir-packs
          test -f tafsir-packs/en/en.json
          test -f tafsir-packs/en/manifest.json

      - name: Commit packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tafsir-packs
          if git diff --cached --quiet; then
            echo "Packs unchanged."
          else
            git commit -m "Publish tafsir packs"
            git push
          fi
